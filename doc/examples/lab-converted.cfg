! NOTE: `telnet bind 192.168.0.25` dropped: telnet listens on the management address; there is no bind in the new syntax
! NOTE: port 2 was an untagged member of VLANs 10,40; converted to access VLAN 40 (its PVID)
!
vlan 10
 name home
vlan 20
 name work
vlan 40
 name barrier
! (VLAN 1 was deleted; it cannot be deleted in the new syntax, but no port is left in it)
!
interface ethernet 1/1
 switchport mode trunk
 switchport trunk native vlan 20
 switchport trunk allowed vlan 20,40
!
interface ethernet 1/2
 switchport access vlan 40
!
interface ethernet 1/3
 description testlab
 switchport access vlan 10
!
interface ethernet 1/4
 switchport access vlan 10
!
interface ethernet 1/5
 switchport access vlan 10
!
interface ethernet 1/6
 switchport access vlan 10
!
interface ethernet 1/7
 switchport access vlan 10
!
interface ethernet 1/8
 switchport access vlan 10
!
interface ethernet 1/9
 switchport mode trunk
 switchport trunk allowed vlan 10,20,40
!
interface vlan 10
 ip address 192.168.0.25 255.255.254.0
!
ip default-gateway 192.168.0.1
feature telnet
!
line vty
 exec-timeout 30 0
!
end
