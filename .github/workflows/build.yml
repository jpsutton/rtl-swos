name: Build firmware

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie

    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          apt update
          apt install make gcc sdcc python3 -y
      - name: Run the host-side unit tests
        run: make -C test
      - name: Check if machine.c can be compiled for all machines
        run: make machine_check
      - name: Make project (4x2/RTL8372)
        run: make CI=1 MACHINE="KP_9000_6XHML_X2"
      - name: Make project (8x1/RTL8373)
        run: make CI=1 MACHINE="KP_9000_9XHML_X_V3_1"
